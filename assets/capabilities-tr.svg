    <text x="18" y="103" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" fill="#475569">STACK: <tspan fill="#fb923c">Tasarım Sistemi</tspan> • <tspan fill="#fb923c">Tipografi</tspan> • <tspan fill="#fb923c">Vektör Varlık</tspan></text>
  </g>

  <!-- CARD 4: YUKSEK PERFORMANS & DONUSUM -->
  <g transform="translate(435, 140)">
    <rect width="415" height="120" rx="8" fill="#070d1e" stroke="#00EDFF" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="0" y="0" width="160" height="2" fill="url(#cyan-glow-tr)" rx="1"/>
    <g transform="translate(18, 16)" stroke="#00EDFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
