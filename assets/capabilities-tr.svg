<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260" fill="none">
  <defs>
    <linearGradient id="cyan-glow-tr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00EDFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00EDFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00EDFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orange-glow-tr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF642B" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FF642B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF642B" stop-opacity="0"/>
