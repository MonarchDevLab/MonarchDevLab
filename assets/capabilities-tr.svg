    <text x="46" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#FF642B" letter-spacing="0.5px">ARAMA MİMARİSİ &amp; GEO</text>
