    <text x="18" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">mutlak görünürlük sağlayan teknik SEO ve GEO mühendisliği.</text>
    <text x="18" y="103" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" fill="#475569">STACK: <tspan fill="#fb923c">Teknik SEO</tspan> • <tspan fill="#fb923c">GEO Motoru</tspan> • <tspan fill="#fb923c">LLM Atfı</tspan></text>
  </g>

