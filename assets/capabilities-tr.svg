    <rect x="0" y="0" width="160" height="2" fill="url(#orange-glow-tr)" rx="1"/>
    <g transform="translate(18, 16)" stroke="#FF642B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
