    <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">Yüksek hassasiyetli marka sistemleri, teknik editoryal</text>
