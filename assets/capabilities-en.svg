  </defs>

  <!-- CARD 1: CUSTOM B2B SOFTWARE -->
  <g transform="translate(0, 0)">
    <rect width="415" height="120" rx="8" fill="#070d1e" stroke="#00EDFF" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="0" y="0" width="160" height="2" fill="url(#cyan-glow)" rx="1"/>
    <g transform="translate(18, 16)" stroke="#00EDFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="4 6 9 11 4 16"/>
      <line x1="12" y1="16" x2="19" y2="16"/>
    </g>
    <text x="46" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#00EDFF" letter-spacing="0.5px">CUSTOM B2B SOFTWARE</text>
    <rect x="305" y="16" width="94" height="18" rx="4" fill="#00EDFF" fill-opacity="0.1" stroke="#00EDFF" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="352" y="29" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" fill="#00EDFF" text-anchor="middle" font-weight="600">ENTERPRISE</text>
    <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">Scalable web architectures, enterprise platforms, and</text>
    <text x="18" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">automation systems built with Next.js, React, and Supabase.</text>
    <text x="18" y="103" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" fill="#475569">STACK: <tspan fill="#38bdf8">Next.js</tspan> • <tspan fill="#38bdf8">React</tspan> • <tspan fill="#38bdf8">Supabase</tspan> • <tspan fill="#38bdf8">Node.js</tspan></text>
  </g>

