    <text x="46" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#00EDFF" letter-spacing="0.5px">PERFORMANCE &amp; CONVERSION</text>
    <rect x="303" y="16" width="96" height="18" rx="4" fill="#00EDFF" fill-opacity="0.1" stroke="#00EDFF" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="351" y="29" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" fill="#00EDFF" text-anchor="middle" font-weight="600">CORE_VITALS</text>
    <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">High-throughput web applications with strict Core Web</text>
    <text x="18" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">Vitals compliance and conversion-focused architectures.</text>
    <text x="18" y="103" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" fill="#475569">STACK: <tspan fill="#38bdf8">Web Vitals</tspan> • <tspan fill="#38bdf8">Edge Compute</tspan> • <tspan fill="#38bdf8">Latency Opt</tspan></text>
