    <text x="358" y="29" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" fill="#FF642B" text-anchor="middle" font-weight="600">AI_SEARCH</text>
    <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">Technical SEO engineering combined with Generative Engine</text>
    <text x="18" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">Optimization for AI-assisted and algorithmic discovery.</text>
    <text x="18" y="103" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" fill="#475569">STACK: <tspan fill="#fb923c">Technical SEO</tspan> • <tspan fill="#fb923c">GEO Engine</tspan> • <tspan fill="#fb923c">LLM Citation</tspan></text>
  </g>

