    <text x="347" y="29" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" fill="#FF642B" text-anchor="middle" font-weight="600">BRAND_SYSTEM</text>
    <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">Precision brand systems, technical editorial layouts,</text>
